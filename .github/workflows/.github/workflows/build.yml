name: Build FB Launcher APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Android Launcher Project
        run: |
          mkdir -p app/src/main/java/com/example/fblauncher
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "FBRedirectLauncher"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.fblauncher"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.fblauncher"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.fblauncher">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <application
                  android:allowBackup="true"
                  android:label="FB Redirect Launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Wallpaper">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:clearTaskOnLaunch="true"
                      android:stateNotNeeded="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/fblauncher/MainActivity.kt
          package com.example.fblauncher
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.ResolveInfo
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          import android.graphics.Color
          import android.graphics.Typeface

          class MainActivity : Activity() {
              private val targetUrl = "https://www.facebook.com"
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 64, 32, 32)
                      setBackgroundColor(Color.parseColor("#800F172A"))
                  }
                  val setupButton = Button(this).apply {
                      text = "Set as Default Launcher (Home App)"
                      setBackgroundColor(Color.parseColor("#1877F2"))
                      setTextColor(Color.WHITE)
                      setOnClickListener { startActivity(Intent(Settings.ACTION_HOME_SETTINGS)) }
                  }
                  rootLayout.addView(setupButton, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                  ).apply { bottomMargin = 24 })
                  val mainIntent = Intent(Intent.ACTION_MAIN, null).apply {
                      addCategory(Intent.CATEGORY_LAUNCHER)
                  }
                  val apps: List<ResolveInfo> = packageManager.queryIntentActivities(mainIntent, 0)
                      .filter { it.activityInfo.packageName != packageName }
                      .sortedBy { it.loadLabel(packageManager).toString().lowercase() }
                  val gridView = GridView(this).apply {
                      numColumns = 4
                      verticalSpacing = 36
                      horizontalSpacing = 16
                      stretchMode = GridView.STRETCH_COLUMN_WIDTH
                      adapter = AppGridAdapter(apps)
                      setOnItemClickListener { _, _, _, _ -> openFacebook() }
                  }
                  rootLayout.addView(gridView, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f
                  ))
                  setContentView(rootLayout)
              }
              private fun openFacebook() {
                  val browserIntent = Intent(Intent.ACTION_VIEW, Uri.parse(targetUrl)).apply {
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  startActivity(browserIntent)
              }
              override fun onBackPressed() {}
              inner class AppGridAdapter(private val appList: List<ResolveInfo>) : BaseAdapter() {
                  override fun getCount(): Int = appList.size
                  override fun getItem(position: Int): Any = appList[position]
                  override fun getItemId(position: Int): Long = position.toLong()
                  override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
                      val info = appList[position]
                      val itemLayout = LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.VERTICAL
                          gravity = Gravity.CENTER
                          setPadding(8, 12, 8, 12)
                      }
                      val iconView = ImageView(this@MainActivity).apply {
                          setImageDrawable(info.loadIcon(packageManager))
                          layoutParams = LinearLayout.LayoutParams(128, 128)
                          scaleType = ImageView.ScaleType.FIT_CENTER
                      }
                      val labelView = TextView(this@MainActivity).apply {
                          text = info.loadLabel(packageManager)
                          textSize = 12f
                          maxLines = 1
                          gravity = Gravity.CENTER
                          setTextColor(Color.WHITE)
                          typeface = Typeface.DEFAULT_BOLD
                          setPadding(0, 10, 0, 0)
                      }
                      itemLayout.addView(iconView)
                      itemLayout.addView(labelView)
                      return itemLayout
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: fb-redirect-launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
